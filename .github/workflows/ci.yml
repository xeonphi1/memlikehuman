name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen --group dev --extra tokenizer
      - run: uv run ruff check src tests examples benchmarks scripts
      - run: uv run ruff format --check src tests examples benchmarks scripts
      - run: uv run pytest -q
      - run: uv build

  host-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/deepseek-harness/package-lock.json
      - run: uv sync --frozen --group dev
      - run: npm ci --ignore-scripts
        working-directory: integrations/deepseek-harness
      - run: npm test
        working-directory: integrations/deepseek-harness
